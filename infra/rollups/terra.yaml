optimism_package:
  persistent: true
  observability:
    enabled: true
  op_contract_deployer_params:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-deployer:v0.4.2
    l1_artifacts_locator: tag://op-contracts/v4.0.0
    l2_artifacts_locator: tag://op-contracts/v4.0.0
  chains:
    terra:
      network_params:
        network_id: "2151908"
        seconds_per_slot: 2
        fund_dev_accounts: true
      participants:
        node0:
          el:
            type: op-geth
          cl:
            type: op-node
      proposer_params:
        proposal_interval: 15s
ethereum_package:
  participants:
    - el_type: geth
      el_image: ethereum/client-go:v1.15.11
      cl_type: lighthouse
      # This preserved minimal genesis uses the v7 preset's 32 blob-commitment
      # bound. v8 uses 4096 and constructs a different empty genesis block.
      # The audited launcher uses a versioned subdirectory inside the SAME
      # beacon volume, retaining the failed v8 database without downgrading it.
      cl_image: sigp/lighthouse@sha256:870934e38931d1a0f6cf47ff976e246a08a4b5509b84ff585aa2233e76744aa8
      vc_image: sigp/lighthouse@sha256:870934e38931d1a0f6cf47ff976e246a08a4b5509b84ff585aa2233e76744aa8
      # A retained local genesis can be thousands of empty slots behind after
      # interrupted startup. Limit Rayon oversubscription on the dev host and
      # allow the first block request to finish that catch-up. These are client
      # scheduling/timeouts, not changes to consensus or governance durations.
      cl_extra_env_vars:
        RAYON_NUM_THREADS: "2"
      vc_extra_params:
        - --use-long-timeouts
        - --long-timeouts-multiplier=60
        - --disable-latency-measurement-service
  persistent: true
  network_params:
    network_id: "3151908"
    preset: minimal
    genesis_delay: 15
    additional_preloaded_contracts: '{"0x4e59b44847b379578588920cA78FbF26c0B4956C":{"balance":"0ETH","code":"0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3","storage":{},"nonce":"1"}}'
